<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="glowKits" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquidKitA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="liquidKitB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="liquidKitC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="glassKit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <circle cx="150" cy="150" r="125" fill="url(#glowKits)"/>

  <!-- Kit box outline -->
  <rect x="46" y="90" width="208" height="150" rx="18" fill="none" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Vial 1 -->
  <g transform="translate(-56,18) scale(0.8)">
    <rect x="122" y="68" width="46" height="24" rx="5" fill="#334155"/>
    <rect x="116" y="88" width="58" height="8" rx="2" fill="#94a3b8"/>
    <rect x="110" y="96" width="70" height="128" rx="14" fill="url(#glassKit)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M114 148 h62 v62 a12 12 0 0 1 -12 12 h-38 a12 12 0 0 1 -12 -12 z" fill="url(#liquidKitA)"/>
  </g>

  <!-- Vial 2 (center, taller) -->
  <g transform="translate(0,0) scale(0.92)">
    <rect x="122" y="60" width="46" height="24" rx="5" fill="#334155"/>
    <rect x="116" y="80" width="58" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="110" y="88" width="70" height="140" rx="14" fill="url(#glassKit)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M114 148 h62 v62 a12 12 0 0 1 -12 12 h-38 a12 12 0 0 1 -12 -12 z" fill="url(#liquidKitB)"/>
    <rect x="118" y="96" width="8" height="120" rx="4" fill="#ffffff" opacity="0.14"/>
  </g>

  <!-- Vial 3 -->
  <g transform="translate(56,18) scale(0.8)">
    <rect x="122" y="68" width="46" height="24" rx="5" fill="#334155"/>
    <rect x="116" y="88" width="58" height="8" rx="2" fill="#94a3b8"/>
    <rect x="110" y="96" width="70" height="128" rx="14" fill="url(#glassKit)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M114 148 h62 v62 a12 12 0 0 1 -12 12 h-38 a12 12 0 0 1 -12 -12 z" fill="url(#liquidKitC)"/>
  </g>

  <!-- Label -->
  <rect x="90" y="250" width="120" height="24" fill="#0d0f17" opacity="0.4"/>
  <text x="150" y="266" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#f0fdfa">KIT BUNDLE</text>
</svg>
