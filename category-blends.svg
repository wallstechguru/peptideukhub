    <rect x="116" y="88" width="58" height="8" rx="2" fill="#94a3b8"/>
    <rect x="110" y="96" width="70" height="128" rx="14" fill="url(#glassBlend)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
